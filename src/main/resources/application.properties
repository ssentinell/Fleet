spring.application.name=fleet
server.address=127.0.0.1
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/fleet?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Europe/Moscow}
spring.datasource.username=${DB_USER:fleet_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
app.seed-demo=${SEED_DEMO:false}
